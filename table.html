<html>
<head>
    <title>Belajar Tabel</title>

    <!-- Semua kode CSS diatur di sini -->
    <style>
        body {
            background-color: yellow;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        table {
            width: 80%;
            border-collapse: collapse;
            margin: 20px auto;
            background-color: #ffffff;
        }
        th {
            background-color: #1a252f;
            color: #ffffff;
            border: 1px solid #dddddd;
            padding: 12px;
            text-align: left;
        }
        td {
            border: 1px solid #dddddd;
            padding: 12px;
        }
    </style>
</head>
<body>

    <h2>Daftar Nilai Mahasiswa</h2>

    <table border=1>
        <tr>
            <th>NIM</th>
            <th>Nama</th>
            <th>Mata Kuliah</th>
        </tr>
        <tr>
            <td>2026001</td>
            <td>Conan Edogawa</td>
            <td>Pemrograman Web</td>
        </tr>
        <tr>
            <td>2026002</td>
            <td>Peter Parker</td>
            <td>Pemrograman Web</td>
        </tr>
    </table>

</body>
</html>
